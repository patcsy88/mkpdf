[workspace]
resolver = "2"
members = ["crates/mkpdf-core", "crates/mkpdf-layout"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
krilla = "0.8"
thiserror = "2"
rustybuzz = "0.20"
mkpdf-core = { path = "crates/mkpdf-core" }
