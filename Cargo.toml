[workspace]
resolver = "3"
members = ["crates/mkpdf-core", "crates/mkpdf-ffi", "crates/mkpdf-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/patcsy88/mkpdf"
authors = ["The mkpdf contributors"]

[workspace.dependencies]
mkpdf-core = { path = "crates/mkpdf-core", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
debug = "line-tables-only"
